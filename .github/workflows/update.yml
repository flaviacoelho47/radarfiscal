name: Atualizar noticias

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Atualizar noticias
        run: npm run update

      - name: Publicar arquivo atualizado
        shell: bash
        run: |
          git config user.name "radar-fiscal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/noticias.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para publicar."
          else
            git commit -m "Atualizacao automatica das noticias"
            git push
          fi
