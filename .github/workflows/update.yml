name: Atualizar notícias
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run update
      - name: Publicar dados atualizados
        run: |
          git config user.name "radar-fiscal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/noticias.json
          git diff --cached --quiet || git commit -m "Atualização diária das notícias"
          git push
